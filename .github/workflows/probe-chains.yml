name: Ketten-Quellen von GitHub aus (Test)
# TEMPORÄR (#307): einmaliger Erreichbarkeitstest im PR, wird vor dem Merge entfernt.
on:
  pull_request:
    paths: ['tools/probe-chains.js', '.github/workflows/probe-chains.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: node tools/probe-chains.js
